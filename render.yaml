# Render Blueprint Specification for CCOS License Server
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ccos-license-server
    runtime: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn license_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false
        value: admin123456
      - key: SECRET_KEY
        generateValue: true
